
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoke Alarm Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard">
        <h1>Smoke Alarm System</h1>
        <p class="subtitle">ESP32 Monitoring Dashboard</p>

        <!-- Smoke Sensor -->
        <section class="card">
            <h2>Smoke Sensor</h2>

            <div id="smokeBox" class="smoke-box clear">
                <span id="smokeStatus">CLEAR</span>
            </div>

            <p class="description">Live sensor status</p>
        </section>

        <!-- Fan Control -->
        <section class="card">
            <h2>Fan Control</h2>

            <div class="mode-switch">
                <button class="mode-btn" data-mode="0">
                    AUTO
                </button>

                <button class="mode-btn" data-mode="1">
                    OFF
                </button>

                <button class="mode-btn" data-mode="2">
                    ON
                </button>
            </div>

            <p class="description">
                Current mode: <strong id="modeStatus">Loading...</strong>
            </p>
        </section>

        <p id="connectionStatus">Connecting to Firebase...</p>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
